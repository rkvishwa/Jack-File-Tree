name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    # If using environment protections for maintainers, add your environment name here:
    # environment: release
    permissions:
      contents: read
      id-token: write # Required for Trusted Publishing OIDC handshake
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          # 👇 FIX 1: Explicitly tell setup-node to prepare the public npm registry.
          # This safely isolates this step from a lingering repository `.npmrc`.
          registry-url: 'https://registry.npmjs.org'
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Publish to npm
        # 👇 FIX 2: Explicitly clearing any local .npmrc overrides right before running publish
        run: |
          rm -f .npmrc
          npm publish --provenance --access public

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to upload to GitHub Packages
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rkvishwa'
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Update package name for GitHub Packages
        run: npm pkg set name="@rkvishwa/jack-file-tree"
      
      - name: Publish to GitHub Packages
        run: |
          rm -f .npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}